name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, DuckDuckGo)
        env:
          INDEXNOW_KEY: cba41c8dc9636e5850ce267857373744
        run: |
          # Wait briefly for the new deploy to be reachable
          sleep 20
          # Pull current sitemap, extract URLs
          URLS_JSON=$(curl -fsSL https://metastrip.app/sitemap.xml \
            | grep -oE '<loc>[^<]+</loc>' \
            | sed -E 's:</?loc>::g' \
            | jq -R . | jq -sc .)
          # Build IndexNow payload
          PAYLOAD=$(jq -nc \
            --arg host "metastrip.app" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://metastrip.app/$INDEXNOW_KEY.txt" \
            --argjson urlList "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          echo "Submitting $(echo "$URLS_JSON" | jq 'length') URLs to IndexNow..."
          curl -fsSL -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            -w "HTTP %{http_code}\n"
